<!DOCTYPE html>
<html>

<head>

    <link rel="manifest" href="manifest.json">
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>IndexedDB Test</title>
  <script src="js/indexeddb.js"></script>
    <script src="js/cards-store.js"></script>
<style>

body{
    font-family:Arial,sans-serif;
    padding:20px;
}

#cards{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(180px,1fr));
    gap:20px;
}

.card{

    background:#f8f9fa;

    border-radius:16px;

    padding:14px;

    box-shadow:
        0 4px 10px rgba(0,0,0,.10);

    transition:.25s;
}

.card img{
    width:120px;
    display:block;
    margin:auto;
    cursor:pointer;
}

.controls{
    display:flex;
    justify-content:center;
    gap:5px;
    margin-top:10px;
}


body{
    font-family:'Open Sans',Arial,sans-serif;
    background:linear-gradient(
        to bottom,
        #eef2f7,
        #dfe6ee
    );
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    font-size:36px;
    margin-bottom:20px;
}

.top-btn{

    width:140px;

    height:45px;

    font-size:14px;

    font-weight:bold;

    border:none;

    border-radius:12px;

    background:#527DF3;

    color:white;

    cursor:pointer;

}

.top-btn:hover{

    transform:translateY(-2px);

}

.amount{

    font-size:24px;

    font-weight:bold;

    background:#28a745;

    color:white;

    width:50px;

    height:50px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    margin:10px auto;
}


.controls button{

    width:36px;
    height:36px;

    border:none;

    background:#ddd;

    border-radius:8px;

    font-size:20px;

    cursor:pointer;
}


.card h3{

    min-height:60px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

}


.card:hover{

    transform:translateY(-4px);

    box-shadow:
        0 8px 20px rgba(0,0,0,.20);

}


.card p{

    text-align:center;

    margin:10px 0;

    color:#555;

    font-weight:600;

}


.top-bar{

    display:flex;
    flex-direction:column;

    align-items:center;

    gap:20px;

    margin-bottom:30px;

}


.backup-buttons{

    display:flex;

    gap:15px;

}

#boosterGrid{

    margin-bottom:30px;

}

.booster-series{

    margin-bottom:25px;

}

.booster-series h3{

    margin-bottom:10px;

    color:#333;

}

.booster-group{

    display:flex;

    flex-wrap:wrap;

    gap:10px;

}

.booster-btn{

    min-width:75px;

    height:42px;

    border:none;

    border-radius:999px;

    background:#527DF3;

    color:white;

    font-weight:700;

    font-size:14px;

    cursor:pointer;

    transition:.2s;

}


.booster-btn:hover{

    background:#3e66d6;

    transform:translateY(-2px);

}


#progressBox{

    background:white;

    border-radius:16px;

    padding:20px;

    margin-bottom:30px;

    box-shadow:
        0 4px 10px rgba(0,0,0,.10);

}

#progressBox h3{

    margin:0 0 10px 0;

    text-align:center;

}

#progressBox p{

    text-align:center;

    font-size:18px;

    font-weight:bold;

}

.progress-bar{

    width:100%;

    height:22px;

    background:#ddd;

    border-radius:999px;

    overflow:hidden;

}

.progress-fill{

    height:100%;

    background:#28a745;

    transition:.3s;

}

.card.owned{

    border:2px solid #28a745;

    background:
        linear-gradient(
            180deg,
            #e8f5e9,
            white
        );

}


#imageModal{

    display:none;

    position:fixed;

    left:0;

    top:0;

    width:100vw;

    height:100vh;

    background:rgba(0,0,0,.9);

    z-index:99999;

    justify-content:center;

    align-items:center;

}

#imageModalContent{

    display:block;

    margin:auto;

    max-width:90vw;

    max-height:90vw;

    margin-top:30px;

    object-fit:contain;

    border-radius:12px;

}

.variant-badge{

    display:block;

    width:max-content;

    margin:0 auto 10px auto;

    padding:4px 10px;

    border-radius:999px;

    background:#ffcc00;

    color:#333;

    font-size:12px;

    font-weight:bold;

    cursor:pointer;

}


.variant-area{

    height:35px;

    display:flex;

    justify-content:center;

    align-items:center;

}


#variantsModal{

    display:none;

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.85);

    z-index:10000;

}

#variantsModalContent{

    background:white;

    border-radius:16px;

    padding:20px;

    margin:30px auto;

    max-width:900px;

    display:flex;

    flex-wrap:wrap;

    gap:20px;

    justify-content:center;

}


.search-box{

    margin-bottom:20px;

    display:flex;

    justify-content:center;

}

#searchBox{

    width:400px;

    max-width:90%;

    padding:12px;

    border:none;

    border-radius:12px;

    font-size:16px;

    box-shadow:
        0 2px 6px rgba(0,0,0,.15);

}


.filters{

    display:flex;

    justify-content:center;

    gap:10px;

    margin-bottom:20px;

}


.filter-btn{

    border:none;

    background:#527DF3;

    color:white;

    padding:10px 15px;

    border-radius:999px;

    cursor:pointer;

    font-weight:bold;

}


.filter-btn.active{

    background:#28a745;

}


</style>

</head>

<body>


<div class="top-bar">

<h1>DIGIMON CARD COLLECTION</h1>

    <div class="top-bar">


<button class="top-btn" onclick="exportCollection()">
    Exportar Backup
</button>




<button class="top-btn" onclick="
    document
        .getElementById('importFile')
        .click()
">
    Importar Backup
</button>

    </div>
</div>


<input
    type="file"
    id="importFile"
    accept=".json"
    style="display:none"
>


<div class="search-box">

    <input
        type="search"
        id="searchBox"
        placeholder="Pesquisar carta..."
    >

</div>

<div class="filters">

    <button
        id="missingOnlyBtn"
        class="filter-btn"
    >
        📋 Só em falta
    </button>

    <button
        id="variantsOnlyBtn"
        class="filter-btn"
    >
        ★ Só Variantes
    </button>

    <button
        id="ownedOnlyBtn"
        class="filter-btn"
    >
        ✅ Só Obtidas
    </button>

</div>

<div id="boosterGrid"></div>

<div id="progressBox"></div>

<div id="cards"></div>




<script>


let currentBooster = null;
let currentSearch = "";
let showMissingOnly = false;
let showVariantsOnly = false;
let showOwnedOnly = false;


async function renderCards(booster = null){

    let cards;

    if(booster){

        cards =
            await getBoosterCards(
                booster
            );

    }else{

        cards =
            await loadCards();

    }

    const container =
        document.getElementById("cards");

    container.innerHTML = "";

   /*
   MOSTRA TODAS AS 20 PRIMEIRAS CARTAS 
   cards.slice(0,20).forEach(async card => {     
   */

  const groupedCards =
    groupVariants(cards);


let groups =
    Object.values(
        groupedCards
    );


if(currentSearch){

    groups =
        groups.filter(
            variants => {

                const card =
                    variants[0];

                return (

                    card.name
                    .toLowerCase()
                    .includes(
                        currentSearch
                    )

                    ||

                    card.cardnumber
                    .toLowerCase()
                    .includes(
                        currentSearch
                    )

                );

            }
        );

}




groups.forEach(async variants => {

    const card =
        variants[0];

console.log(card);
console.log(card.cardnumber);

        const amount =
            await getCardAmount(
                card.cardnumber
            );


if(
    showMissingOnly &&
    amount > 0
){
    return;
}


if(
    showOwnedOnly &&
    amount === 0
){
    return;
}


        const div =
            document.createElement("div");

        div.className = "card";


        if(amount > 0){

            div.classList.add(
                "owned"
            );

}

const variantCount =
    variants.length - 1;

if(
    showVariantsOnly &&
    variantCount === 0
){
    return;
}

        div.innerHTML = `

        
        <div>
            <img
            src="${card.cardimage}" 
            onclick="openModal('${card.cardimage}')"
            onerror="this.onerror=null; this.src='images/fallback.jpg';"
        >

            <h3>${card.name}</h3>

<div class="variant-area">

            ${variantCount > 0 ? `
            <p class="variant-badge" onclick="openVariantsModal('${card.cardnumber}')">
                ★ ${variantCount} Variante${variantCount > 1 ? "s" : ""}
            </p>
        ` : ""}

</div>

            <p>${card.cardnumber}</p>

            <div class="amount" id="amount-${card.cardnumber}">
                ${amount}
            </div>

            <div class="controls">

                <button onclick="
                    updateAmount(
                        '${card.cardnumber}',
                        -1
                    )
                ">
                    -
                </button>

                <button onclick="
                    updateAmount(
                        '${card.cardnumber}',
                        1
                    )
                ">
                    +
                </button>

            </div>
            </div>
        `;

const badge =
    div.querySelector(
        ".variant-badge"
    );

if(badge){

    badge.onclick = (event) => {

        event.stopPropagation();

        openVariantsModal(
            variants
        );

    };

}
 
        container.appendChild(div);

    });

}

async function updateAmount(
    cardnumber,
    change
){

    let current =
        await getCardAmount(
            cardnumber
        );

    current += change;

    if(current < 0){
        current = 0;
    }

    await saveCardAmount(
        cardnumber,
        current
    );

    document.getElementById(
        `amount-${cardnumber}`
    ).innerText =
        current;


    if(currentBooster){

    renderCards(
        currentBooster
    );

    renderProgress(
        currentBooster
    );

}
}

    document
    .getElementById("importFile")
    .addEventListener(
        "change",
        async function(){

            const file =
                this.files[0];

            if(!file){
                return;
            }

            await importCollection(
                file
            );

            alert(
                "Backup importado!"
            );

            renderCards();

        }
    );




async function renderBoosterGrid(){

    const grouped =
        await groupBoosters();

    const container =
        document.getElementById(
            "boosterGrid"
        );

    container.innerHTML = "";

    Object.entries(grouped)
    .forEach(([series, boosters]) => {

        const section =
            document.createElement(
                "div"
            );

        section.className =
            "booster-series";

        let html = `
            <h3>${series} Series</h3>
            <div class="booster-group">
        `;

        boosters.forEach(booster => {

            html += `
                <button
                    class="booster-btn"
                    onclick="
                        selectBooster(
                            '${booster}'
                        )
                    "
                >
                    ${booster}
                </button>
            `;

        });

        html += `
            </div>
        `;

        section.innerHTML = html;

        container.appendChild(
            section
        );

    });

}

function selectBooster(
    booster
){

    currentBooster = booster;

    renderCards(
        booster
    );

    renderProgress(
        booster
    );

}

async function renderProgress(
    booster
){

    const cards =
        await getBoosterCards(
            booster
        );

    const total =
        cards.length;

    let owned = 0;

    for(const card of cards){

        const amount =
            await getCardAmount(
                card.cardnumber
            );

        if(amount > 0){
            owned++;
        }

    }

    const percent =
        total
            ? Math.round(
                owned * 100 / total
              )
            : 0;

    document.getElementById(
        "progressBox"
    ).innerHTML = `

        <h3>${booster}</h3>

        <p>
            ${owned} / ${total}
            (${percent}%)
        </p>

        <div class="progress-bar">

            <div
                class="progress-fill"
                style="
                    width:
                    ${percent}%;
                "
            ></div>

        </div>

    `;

}


function openModal(src){

    document
        .getElementById("imageModal")
        .style.display =
        "block";

    document
        .getElementById("imageModalContent")
        .src = src;

}

function closeModal(){

    document
        .getElementById("imageModal")
        .style.display =
        "none";

}

function openVariantsModal(variants){

    const container =
        document.getElementById(
            "variantsModalContent"
        );

    container.innerHTML = "";

    variants.forEach(card => {

        const html = `
            <div class="card">

                <img
                src="${card.cardimage}" 
                onerror="this.onerror=null; this.src='images/fallback.jpg';"
                >

                <h3>${card.name}</h3>

                <p>${card.cardnumber}</p>

            </div>
        `;

        container.innerHTML += html;

    });

    document
        .getElementById(
            "variantsModal"
        )
        .style.display = "block";

}

function closeVariantsModal(){

    document
        .getElementById(
            "variantsModal"
        )
        .style.display = "none";

}


document
.getElementById(
    "searchBox"
)
.addEventListener(
    "input",
    function(){

        currentSearch =
            this.value
            .toLowerCase();

        renderCards(
            currentBooster
        );

    }
);


document
.getElementById(
    "missingOnlyBtn"
)
.addEventListener(
    "click",
    function(){

        showMissingOnly =
            !showMissingOnly;

        this.classList.toggle(
            "active"
        );

        renderCards(
            currentBooster
        );

    }
);

document
.getElementById(
    "variantsOnlyBtn"
)
.addEventListener(
    "click",
    function(){

        showVariantsOnly =
            !showVariantsOnly;

        this.classList.toggle(
            "active"
        );

        renderCards(
            currentBooster
        );

    }
);


document
.getElementById(
    "ownedOnlyBtn"
)
.addEventListener(
    "click",
    function(){

        showOwnedOnly =
            !showOwnedOnly;

        this.classList.toggle(
            "active"
        );

        renderCards(
            currentBooster
        );

    }
);


renderBoosterGrid();
renderCards();


</script>


<div id="variantsModal" onclick="closeVariantsModal()">

    <div
        id="variantsModalContent"
        onclick="event.stopPropagation()"
    >

    </div>

</div>

<div id="imageModal" onclick="closeModal()">
    <img id="imageModalContent">
</div>
  


<script>

if(
    "serviceWorker"
    in navigator
){

    navigator
    .serviceWorker
    .register(
        "service-worker.js"
    )
    .then(() => {

        console.log(
            "Service Worker registado"
        );

    });

}

</script>

</body>

</html>
